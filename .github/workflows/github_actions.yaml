name: SnowForm Workflow
run-name: ${{ github.actor }} is testing updates for a SnowForm Terraform Module 🚀
on: [push]
env:
  SF_LOG: DEBUG
  SNOWFLAKE_RETRY_TIMEOUT: 120  # 2 minutes timeout
  SNOWFLAKE_RETRY_COUNT: 2
  # Keyless access to the GCS state bucket, see scripts/setup_gcp_state_backend.sh
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/294471397577/locations/global/workloadIdentityPools/github/providers/snowform-example-usage
  GCP_SERVICE_ACCOUNT: snowform-tfstate@quickstart-1592892564690.iam.gserviceaccount.com

# Queue runs of the same branch so two runs never plan/apply against the state at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache TFLint plugin dir
        uses: actions/cache@v3
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        working-directory: terraform
        run: tflint --init

      - name: Run TFLint
        working-directory: terraform
        run: tflint --recursive

  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: Terraform Format Check
        working-directory: terraform
        run: tofu fmt -check -recursive

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: OpenTofu init
        working-directory: terraform
        run: tofu init -backend=false

      - name: Run OpenTofu Tests
        working-directory: terraform
        run: tofu test

  kics-scan:
    name: KICS Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2.1.14
        with:
          path: '.'
          fail_on: high,critical
          output_formats: 'json'
          output_path: 'kics-results.json'
          disable_progress_bar: true

      - name: Upload KICS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kics-results.json
          path: kics-results.json

  tofu-validate:
    name: OpenTofu Validate
    needs: [tflint, terraform-fmt, unit-test, kics-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init -backend=false

      - name: OpenTofu Validate
        working-directory: terraform
        run: tofu validate

  tofu-plan:
    name: OpenTofu Plan
    needs: [tofu-validate]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list artifacts for the one-time state migration
      id-token: write # Workload Identity Federation to GCP
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1
          tofu_wrapper: false # plain stdout for the migration check below

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init

      # TODO: remove the next two steps (and the ENCRYPTION_KEY secret) once the state is in GCS.
      # One-time migration of the old state from the encrypted GitHub Actions artifact.
      - name: Download legacy state artifact
        uses: badgerhobbs/terraform-state@v2
        with:
          encryption_key: ${{ secrets.ENCRYPTION_KEY }}
          operation: download
          location: artifact
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: terraform
        continue-on-error: true

      - name: Migrate legacy state to GCS
        working-directory: terraform
        run: |
          if [ -f terraform.tfstate ] && [ -z "$(tofu state list 2>/dev/null || true)" ]; then
            echo "GCS state is empty, pushing the legacy state from the artifact"
            tofu state push terraform.tfstate
          else
            echo "Nothing to migrate"
          fi
          rm -f terraform.tfstate terraform.tfstate.encrypted

      - name: OpenTofu Plan
        working-directory: terraform
        env:
          TF_VAR_SNOWFLAKE_DEPLOY_USER: ${{ vars.TF_VAR_SNOWFLAKE_DEPLOY_USER }}
          TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_BASE64: ${{ secrets.TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_BASE64 }}
          TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_PASSPHRASE: ${{ secrets.TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_PASSPHRASE }}
        run: tofu plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  tofu-apply:
    name: OpenTofu Apply
    needs: [tofu-plan]
    # Only main deploys; other branches stop after the plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # Workload Identity Federation to GCP
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      # The state is written to GCS during apply, also when apply fails halfway
      - name: OpenTofu Apply
        working-directory: terraform
        env:
          TF_VAR_SNOWFLAKE_DEPLOY_USER: ${{ vars.TF_VAR_SNOWFLAKE_DEPLOY_USER }}
          TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_BASE64: ${{ secrets.TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_BASE64 }}
          TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_PASSPHRASE: ${{ secrets.TF_VAR_SNOWFLAKE_DEPLOY_PRIVATE_KEY_PASSPHRASE }}
        run: tofu apply -auto-approve tfplan
